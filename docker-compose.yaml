services:
  # =========================================================================
  # 1. LOCAL POSTGRES DATABASE
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: trends-bird-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. NESTJS BACKEND API MODULE
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trends-bird-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-mydb}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

  # =========================================================================
  # 3. REACT + VITE FRONTEND DASHBOARD (Nginx Reverse Proxy)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trends-bird-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
